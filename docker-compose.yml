services:
  tossinvest-mcp:
    # To use the image published by CI instead of building locally, drop the
    # `build` line and point `image` at GHCR — handy on a NAS that shouldn't
    # compile TypeScript:
    #   image: ghcr.io/meteoroh/tossinvest-mcp:latest
    build: .
    image: tossinvest-mcp-server:1.0.0
    container_name: tossinvest-mcp
    restart: unless-stopped

    # host:container. Only the HOST side can collide with other NAS services —
    # the container side is namespaced and never conflicts, so leave it at 3000.
    # Override the host port with MCP_HOST_PORT in .env if 3939 is taken.
    #
    # Bound to loopback on purpose: reach it over Tailscale/WireGuard, or put a
    # TLS-terminating reverse proxy in front. Drop the 127.0.0.1 prefix only if
    # you understand that it then answers on every NAS interface.
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-3939}:3000"

    env_file:
      - .env

    # Values here OVERRIDE anything with the same name in .env — that is why the
    # safety-critical flag lives here rather than in the env file, where a stray
    # edit could silently enable trading.
    environment:
      TRANSPORT: http
      PORT: "3000"
      # Bind inside the container. Must stay 0.0.0.0 or the `ports` mapping
      # below has nothing to forward to; host-side exposure is controlled by
      # `ports`, not by this.
      HOST: 0.0.0.0
      # Drop to "false" only in a deployment you specifically want to trade from.
      TOSSINVEST_READ_ONLY: "true"

    # Nothing here needs to write to disk or gain privileges.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
